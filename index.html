<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Journey</title>
    <style>
        :root {
            --primary: #ff758c;
            --bg: #fff5f7;
            --text: #4a4a4a;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg);
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; overflow-x: hidden;
        }

        .card {
            background: white; width: 90%; max-width: 500px;
            padding: 2rem; border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 117, 140, 0.2);
            text-align: center; transition: opacity 0.4s ease;
        }

        .image-container { width: 100%; margin-bottom: 1.5rem; border-radius: 15px; overflow: hidden; }
        img { width: 100%; height: auto; display: block; object-fit: contain; }

        h1 { font-size: 1.3rem; color: var(--text); margin-bottom: 1.5rem; line-height: 1.6; white-space: pre-wrap; }

        .options { display: flex; flex-direction: column; gap: 12px; }
        
        button {
            padding: 14px; border: none; border-radius: 12px;
            background: var(--primary); color: white; font-weight: bold;
            cursor: pointer; transition: 0.2s;
        }
        button:hover { background: #ff5e78; transform: scale(1.02); }

        /* Lockbox UI */
        .lock-input {
            width: 80%; padding: 12px; margin-bottom: 10px;
            border: 2px solid var(--primary); border-radius: 10px;
            font-size: 1.2rem; text-align: center; outline: none;
        }

        /* Runaway Button */
        #runaway-btn { background-color: #bdc3c7 !important; transition: all 0.2s ease; z-index: 1000; }

        /* Error message style */
        #error-msg {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 5px;
            font-weight: bold;
            min-height: 1.2rem; /* Keeps layout stable */
        }

        /* Shake Animation */
        .shake {
            animation: shake 0.4s ease-in-out;
            border-color: #e74c3c !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }

        /* Hearts */
        .heart { position: fixed; top: -1vh; pointer-events: none; animation: fall 3s linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

<div class="card" id="game-card">
    <div class="image-container"><img id="scene-img" src="" alt=""></div>
    <h1 id="scene-text"></h1>
    <div id="custom-content"></div> <div class="options" id="scene-options"></div>
</div>

<script>
    const scenes = {
        page1: {
            text: "Hi [Wife's Name], I have a surprise for you...",
            image: "cy_pup1.jpg",
            options: [{ text: "Open It", next: "page2" }]
        },
        page2: {
            text: "Insert your long, beautiful paragraph here.\nYou can use \\n for new lines to make it easy to read!",
            image: "us.jpg",
            options: [{ text: "Keep Going", next: "page3" }]
        },
        page3: {
            text: "This box is locked! Enter the secret code to proceed.\n(Hint: Maybe a special date or a word?)",
            image: "lockbox.jpg",
            isLockbox: true,
            correctCode: "1234", // CHANGE THIS CODE
            next: "page4"
        },
        page4: {
            text: "Will you be my Valentine?",
            image: "valentine.jpg",
            options: [
                { text: "Yes!", next: "page5" },
                { text: "No", next: "runaway" }
            ]
        },
        page5: {
            text: "Are you free next Friday for a date? Pick your favorite spot!",
            image: "dinner.jpg",
            options: [
                { text: "Restaurant A (Italian)", next: "page6" },
                { text: "Restaurant B (Sushi)", next: "page6" }
            ]
        },
        page6: {
            text: "I love you forever! ❤️\nSee you on Friday!",
            image: "end.jpg",
            isFinal: true,
            options: [{ text: "Start Over", next: "page1" }]
        }
    };

    function renderScene(key) {
        const scene = scenes[key];
        const optionsContainer = document.getElementById('scene-options');
        const customContent = document.getElementById('custom-content');
        
        document.getElementById('scene-text').innerText = scene.text;
        document.getElementById('scene-img').src = scene.image;
        optionsContainer.innerHTML = '';
        customContent.innerHTML = '';

        if (scene.isFinal) sprinkleHearts();

    if (scene.isLockbox) {
        const input = document.createElement('input');
        input.className = 'lock-input';
        input.placeholder = "Enter Code...";
        input.type = "text";
        
        // Container for the error message
        const errorDisplay = document.createElement('div');
        errorDisplay.id = 'error-msg';
        
        const submitBtn = document.createElement('button');
        submitBtn.innerText = "Unlock";

        submitBtn.onclick = () => {
            const userInput = input.value.trim().toLowerCase();
            const correct = scene.correctCode.toLowerCase();

            if (userInput === correct) {
                renderScene(scene.next);
            } else {
                // Error Handling Logic
                errorDisplay.innerText = "Incorrect code, try again! ❤️";
                input.classList.add('shake');
                
                // Remove the shake class after animation finishes so it can shake again
                setTimeout(() => {
                    input.classList.remove('shake');
                }, 400);
                
                // Clear input after a short delay (optional)
                input.value = ""; 
            }
        };

        customContent.appendChild(input);
        customContent.appendChild(errorDisplay);
        optionsContainer.appendChild(submitBtn);
    }
    }

    function moveButton() {
        const btn = document.getElementById('runaway-btn');
        btn.style.position = 'fixed';
        btn.style.left = Math.random() * (window.innerWidth - 100) + 'px';
        btn.style.top = Math.random() * (window.innerHeight - 50) + 'px';
    }

    function sprinkleHearts() {
        for (let i = 0; i < 40; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '💖';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }, i * 150);
        }
    }

    renderScene('page1');
</script>
</body>
</html>
