<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Surprise</title>
    <style>
        :root {
            --primary: #ff758c;
            --bg: #fff5f7;
            --text: #4a4a4a;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg);
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; margin: 0; overflow-x: hidden;
        }

        .card {
            background: white; width: 90%; max-width: 500px;
            padding: 2rem; border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 117, 140, 0.2);
            text-align: center; transition: opacity 0.4s ease;
        }

        /* Dynamic Image Frame */
        .image-container { width: 100%; margin-bottom: 1.5rem; border-radius: 15px; overflow: hidden; }
        img { width: 100%; height: auto; display: block; object-fit: contain; }

        h1 { font-size: 1.2rem; color: var(--text); margin-bottom: 1.5rem; line-height: 1.6; white-space: pre-wrap; }

        /* The Letter Box for Page 2 */
        .letter-box {
            background: #fffafa; border: 1px dashed var(--primary);
            padding: 20px; border-radius: 15px; margin: 15px 0;
            font-style: italic; color: #555; line-height: 1.8;
        }

        /* Buttons and Inputs */
        .options { display: flex; flex-direction: column; gap: 12px; min-height: 50px; }
        
        button {
            padding: 14px; border: none; border-radius: 12px;
            background: var(--primary); color: white; font-weight: bold;
            cursor: pointer; transition: 0.2s; font-size: 1rem;
        }
        button:hover { background: #ff5e78; transform: scale(1.02); }

        .lock-input {
            width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 5px;
            border: 2px solid var(--primary); border-radius: 10px;
            font-size: 1.2rem; text-align: center; outline: none;
        }

        #error-msg { color: #e74c3c; font-size: 0.85rem; margin-bottom: 10px; min-height: 1rem; }

        /* Animations */
        #runaway-btn { background-color: #bdc3c7 !important; transition: all 0.2s ease; z-index: 1000; }

        .shake { animation: shake 0.4s ease-in-out; border-color: #e74c3c !important; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }

        .heart { position: fixed; top: -1vh; pointer-events: none; z-index: 999; animation: fall 3s linear forwards; }
        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

<div class="card" id="game-card">
    <div class="image-container"><img id="scene-img" src="" alt=""></div>
    <h1 id="scene-text"></h1>
    <div id="custom-content"></div> <div class="options" id="scene-options"></div> </div>

<script>
    const scenes = {
        page1: {
            text: "Yo Zi, Ready? 老婆想要，老婆得到！",
            image: "https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExZnB3aDh5YnFkb2s2aW5xbjc4cTFyNTVmeWpuYzFnYXAyemx6NXN0ZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MvZJtkjJN81Cgx2X9F/giphy.gif", // Replace with your GIF or image
            options: [{ text: "Open It", next: "page2" }]
        },
        page2: {
            text: "My Dearest,\n\nCan't believe this is our 4th Valentine's day! Also, I can't believe I am not only your husband but also witness your growth since you were still a little girl in college!",
            image: "https://www.cinemacats.com/wp-content/uploads/movies/kikisdeliveryservice18.jpg",
            isLetter: true,
            options: [{ text: "Next", next: "page3" }]
        },
        page3: {
            text: "Wait! This box is locked.\nOnly my favorite person knows the code!",
            image: "lock.gif",
            isLockbox: true,
            correctCode: "1234", // CHANGE THIS TO YOUR CODE
            next: "page4"
        },
        page4: {
            text: "Will you be my Valentine?",
            image: "question.gif",
            options: [
                { text: "Yes!", next: "page5" },
                { text: "No", next: "runaway" }
            ]
        },
        page5: {
            text: "Are you free next Friday for a date? Pick a place!",
            image: "date.jpg",
            options: [
                { text: "Restaurant Name A", next: "page6" },
                { text: "Restaurant Name B", next: "page6" }
            ]
        },
        page6: {
            text: "I love you forever! ❤️\nSee you on Friday!",
            image: "end.gif",
            isFinal: true,
            options: [{ text: "Restart", next: "page1" }]
        }
    };

    function renderScene(key) {
        const scene = scenes[key];
        const optionsContainer = document.getElementById('scene-options');
        const customContent = document.getElementById('custom-content');
        const textElement = document.getElementById('scene-text');
        
        // Reset everything
        optionsContainer.innerHTML = '';
        customContent.innerHTML = '';
        
        // Handle Images
        document.getElementById('scene-img').src = scene.image;

        // Handle Victory Hearts
        if (scene.isFinal) sprinkleHearts();

        // Handle Text Layout (Letter vs Normal)
        if (scene.isLetter) {
            textElement.innerHTML = `<div class="letter-box">${scene.text}</div>`;
        } else {
            textElement.innerText = scene.text;
        }

        // Handle Lockbox Logic
        if (scene.isLockbox) {
            const input = document.createElement('input');
            input.className = 'lock-input';
            input.placeholder = "Enter the code...";
            
            const errorDiv = document.createElement('div');
            errorDiv.id = 'error-msg';

            const unlockBtn = document.createElement('button');
            unlockBtn.innerText = "Unlock";
            unlockBtn.onclick = () => {
                if (input.value.trim().toLowerCase() === scene.correctCode.toLowerCase()) {
                    renderScene(scene.next);
                } else {
                    errorDiv.innerText = "Wrong code! Try again ❤️";
                    input.classList.add('shake');
                    setTimeout(() => input.classList.remove('shake'), 400);
                    input.value = "";
                }
            };

            customContent.appendChild(input);
            customContent.appendChild(errorDiv);
            optionsContainer.appendChild(unlockBtn);

        } else {
            // Handle Normal Buttons
            scene.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.innerText = opt.text;
                
                if (opt.text.toLowerCase() === 'no') {
                    btn.id = 'runaway-btn';
                    btn.onmouseover = moveButton;
                    btn.onclick = moveButton; // For mobile
                } else {
                    btn.onclick = () => renderScene(opt.next);
                }
                optionsContainer.appendChild(btn);
            });
        }
    }

    function moveButton() {
        const btn = document.getElementById('runaway-btn');
        btn.style.position = 'fixed';
        const x = Math.random() * (window.innerWidth - 120);
        const y = Math.random() * (window.innerHeight - 50);
        btn.style.left = x + 'px';
        btn.style.top = y + 'px';
    }

    function sprinkleHearts() {
        for (let i = 0; i < 50; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = ['💖','💗','❤️','💕'][Math.floor(Math.random()*4)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 3000);
            }, i * 150);
        }
    }

    // Initialize Game
    renderScene('page1');
</script>

</body>
</html>
